<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - MediKiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<header class="bg-primary text-white py-3 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="navbar-brand mb-0 h1 text-white text-decoration-none">MediKiosk</a>
    </div>
</header>

<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container" style="max-width: 440px;">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="h4 fw-bold mb-1 medikiosk-title">MediKiosk</h1>
                <p class="text-muted small mb-4">Patient Case-Taking Platform</p>

                <div th:if="${param.error}" class="alert alert-danger" role="alert" th:text="#{login.invalid}">
                    Invalid username or password.
                </div>
                <div th:if="${param.logout}" class="alert alert-success" role="alert" th:text="#{login.loggedout}">
                    You have been signed out.
                </div>

                <form th:action="@{/login}" method="post" role="form">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control"
                               autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Sign in</button>
                </form>

                <hr class="my-4">
                <p class="text-muted small mb-1">Demo credentials:</p>
                <ul class="text-muted small mb-0">
                    <li>Patient &mdash; <code>patient / patient123</code></li>
                    <li>Physician &mdash; <code>physician / physician123</code></li>
                    <li>Admin &mdash; <code>admin / admin123</code></li>
                </ul>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white border-top py-3 text-center text-muted small">
    &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> MediKiosk &middot; SIH26047
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
