<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account - MediKiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<header class="bg-primary text-white py-3 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="text-white text-decoration-none">
            <th:block th:replace="~{fragments/brand :: brand('sm')}"></th:block>
        </a>
    </div>
</header>

<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container" style="max-width: 520px;">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="h4 fw-bold mb-1 medikiosk-title">Create your account</h1>
                <p class="text-muted small mb-4">One account to begin your case-taking journey.</p>

                <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                <form th:action="@{/register}" method="post" role="form">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control"
                               th:value="${username}" autocomplete="username" required autofocus
                               pattern="[a-zA-Z0-9._-]{3,}" title="At least 3 characters using letters, digits, . _ - only">
                    </div>
                    <div class="mb-3">
                        <label for="displayName" class="form-label">Your name</label>
                        <input type="text" id="displayName" name="displayName" class="form-control"
                               th:value="${displayName}" autocomplete="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control"
                               minlength="6" autocomplete="new-password" required>
                        <div class="form-text">
                            At least <span th:text="${minPasswordLength}">6</span> characters. Any combination of characters is acceptable.
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">Confirm password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                               minlength="6" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Create account</button>
                </form>

                <hr class="my-4">
                <p class="text-muted small text-center mb-0">
                    Already have an account? <a th:href="@{/login}">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white border-top py-3 text-center text-muted small">
    &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> MediKiosk &middot; SIH26047
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
