<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Physician Portal - MediKiosk')}">
    <meta charset="UTF-8">
    <title>Physician Portal - MediKiosk</title>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<div th:replace="~{fragments/nav :: authnav}"></div>

<main class="flex-grow-1 py-5">
    <div class="container">
        <div class="card shadow-sm mx-auto" style="max-width: 720px;">
            <div class="card-body p-5">
                <h1 class="h4 fw-bold mb-1 medikiosk-title">MediKiosk</h1>
                <h2 class="h5 text-muted mb-4">Physician Home</h2>
                <hr class="my-4">

                <div class="mb-4">
                    <p class="mb-0"><strong>Physician name:</strong> <span th:text="${user.displayName}">-</span></p>
                    <p class="mb-0"><strong>Role:</strong> <span th:text="${role}">Physician</span></p>
                </div>

                <div class="alert alert-info" role="alert">
                    The physician workspace will be added in a later checkpoint.
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white border-top py-3 text-center text-muted small">
    &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> MediKiosk &middot; SIH26047
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
