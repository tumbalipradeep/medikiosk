<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="head(title)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">MediKiosk</title>
    <link rel="icon" type="image/png" th:href="@{/img/medikiosk-logo-32.png}">
    <link rel="apple-touch-icon" type="image/png" th:href="@{/img/medikiosk-logo-192.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"
          referrerpolicy="no-referrer">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script>
        (function () {
            'use strict';
            try {
                var prefs = JSON.parse(localStorage.getItem('medikiosk.prefs') || '{}');
                var doc = document.documentElement;
                if (prefs.theme) doc.setAttribute('data-bs-theme', prefs.theme);
                if (prefs.motion) doc.setAttribute('data-mk-motion', prefs.motion);
                if (prefs.textSize) doc.setAttribute('data-mk-textsize', prefs.textSize);
            } catch (e) {
                /* preferences are cosmetic; never block rendering */
            }
        })();
    </script>
</head>
</html>
