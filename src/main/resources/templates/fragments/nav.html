<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="authnav">
<header class="bg-primary text-white shadow-sm">
    <div class="container">
        <div class="mk-topnav">
            <a th:href="${user.roleLabel == 'PHYSICIAN'} ? '/physician/home' : (${user.roleLabel == 'ADMIN'} ? '/admin/home' : '/patient/home')"
               class="text-white text-decoration-none" aria-label="MediKiosk home">
                <th:block th:replace="~{fragments/brand :: brand('sm')}"></th:block>
            </a>
            <nav class="mk-topnav__links" aria-label="Portal">
                <a class="mk-topnav__link"
                   th:href="${user.roleLabel == 'PHYSICIAN'} ? '/physician/home' : (${user.roleLabel == 'ADMIN'} ? '/admin/home' : '/patient/home')">Home</a>
                <th:block th:if="${user.roleLabel == 'ADMIN'}">
                    <a class="mk-topnav__link" th:href="@{/admin/accounts}">Accounts</a>
                    <a class="mk-topnav__link" th:href="@{/admin/settings}">Settings</a>
                </th:block>
                <a class="mk-topnav__link" th:href="@{/account/profile}">Account</a>
            </nav>
            <div class="mk-topnav__links">
                <span class="small text-white-50">Signed in as <strong class="text-white" th:text="${user.displayName}">User</strong></span>
                <form th:action="@{/logout}" method="post" class="mb-0">
                    <button type="submit" class="btn btn-outline-light btn-sm mk-topnav__cta">Sign out</button>
                </form>
            </div>
        </div>
    </div>
</header>
<a class="skip-link" href="#main-content">Skip to content</a>
</html>
