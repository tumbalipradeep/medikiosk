<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="publicnav(active)">
<header class="mk-topnav-header">
    <div class="container">
        <div class="mk-topnav">
            <a th:href="@{/}" class="text-decoration-none" aria-label="MediKiosk home">
                <th:block th:replace="~{fragments/brand :: brand('sm')}"></th:block>
            </a>
            <nav class="mk-topnav__links" aria-label="Primary">
                <a th:href="@{/}" class="mk-topnav__link" th:classappend="${active == 'home'} ? 'is-active' : ''">Home</a>
                <a th:href="@{/about}" class="mk-topnav__link" th:classappend="${active == 'about'} ? 'is-active' : ''">About</a>
                <a th:href="@{/features}" class="mk-topnav__link" th:classappend="${active == 'features'} ? 'is-active' : ''">Features</a>
                <a th:href="@{/privacy}" class="mk-topnav__link" th:classappend="${active == 'privacy'} ? 'is-active' : ''">Privacy</a>
                <a th:href="@{/contact}" class="mk-topnav__link" th:classappend="${active == 'contact'} ? 'is-active' : ''">Contact</a>
            </nav>
            <div class="mk-topnav__links">
                <a th:href="@{/login}" class="btn btn-outline-primary btn-sm mk-topnav__cta">Sign in</a>
            </div>
        </div>
    </div>
</header>
<a class="skip-link" href="#main-content">Skip to content</a>
</html>
