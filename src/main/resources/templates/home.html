<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MediKiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<header class="bg-primary text-white py-3 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand mb-0 h1 text-white">MediKiosk</span>
        <span id="appStatus" class="badge bg-success">UP</span>
    </div>
</header>

<main class="flex-grow-1 d-flex align-items-center">
    <div class="container">
        <div class="card shadow-sm mx-auto" style="max-width: 640px;">
            <div class="card-body p-5 text-center">
                <h1 class="display-5 fw-bold mb-3 medikiosk-title">MediKiosk</h1>
                <h2 class="h5 text-muted mb-4">Patient Case-Taking Platform</h2>
                <hr class="my-4">
                <p class="lead mb-1">Foundation Ready</p>
                <p class="text-muted mb-0">Application Status: <span class="fw-semibold text-success">UP</span></p>
                <div class="mt-4 small text-secondary" id="kioskMeta"></div>
                <div class="mt-4">
                    <a th:href="@{/login}" class="btn btn-primary">Sign in</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white border-top py-3 text-center text-muted small">
    &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> MediKiosk &middot; SIH26047
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
