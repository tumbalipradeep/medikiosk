<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('MediKiosk')}">
    <meta charset="UTF-8">
    <title>MediKiosk</title>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<header class="bg-primary text-white py-3 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <th:block th:replace="~{fragments/brand :: brand('sm')}"></th:block>
        <span id="appStatus" class="badge bg-success mk-motion-badge-in">UP</span>
    </div>
</header>

<main class="flex-grow-1 d-flex align-items-center mk-hero">
    <div class="container">
        <div class="card shadow-sm mx-auto mk-hero-enter" style="max-width: 680px;">
            <div class="card-body p-5 text-center">
                <div class="d-flex justify-content-center mb-3">
                    <th:block th:replace="~{fragments/brand :: brand('xl')}"></th:block>
                </div>
                <h2 class="h5 text-muted mb-4">Patient Case-Taking Platform</h2>
                <hr class="my-4">
                <p class="lead mb-1">Local demo deployment</p>
                <p class="text-muted mb-0">Application Status: <span id="appStatusLive" class="badge bg-secondary">Checking&hellip;</span></p>
                <div class="mt-2 small text-secondary">
                    Kiosk operates with a local, non-ABHA identity. Nothing is transmitted to
                    ABDM or an external HIS.
                </div>
                <div class="mt-4 small text-secondary" id="kioskMeta"></div>
                <div class="mt-4">
                    <a th:href="@{/login}" class="btn btn-primary btn-lg btn-lg-mobile mk-interactive">Sign in</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white border-top py-3 text-center text-muted small">
    &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> MediKiosk &middot; SIH26047
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
