<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Active sessions - MediKiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<header class="bg-primary text-white py-3 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}" class="text-white text-decoration-none">
            <th:block th:replace="~{fragments/brand :: brand('sm')}"></th:block>
        </a>
    </div>
</header>

<main class="flex-grow-1 py-5">
    <div class="container" style="max-width: 720px;">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="h4 fw-bold mb-1 medikiosk-title">Active sessions</h1>
                <p class="text-muted small mb-4">Devices where you are currently signed in.</p>

                <div th:if="${param.passwordUpdated}" class="alert alert-success" role="alert">
                    Password updated. For your safety, other active sessions have been retained &mdash; consider signing them out below.
                </div>

                <form th:action="@{/account/sessions/expire}" method="post">
                    <div class="list-group mb-4">
                        <div th:each="session : ${sessions}" class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <strong th:if="${session.current}" class="text-success">This device</strong>
                                <span th:unless="${session.current}">Other device session</span>
                                <div class="text-muted small"
                                     th:text="'Last activity: ' + ${#temporals.format(session.lastRequest, 'dd MMM yyyy, HH:mm')}">
                                    Last activity
                                </div>
                            </div>
                            <div th:unless="${session.current}" class="ms-3">
                                <input type="checkbox" class="form-check-input"
                                       name="sessionIds" th:value="${session.sessionId()}"
                                       th:id="'session-' + ${session.sessionId()}">
                            </div>
                        </div>
                        <div th:if="${sessions.isEmpty()}" class="list-group-item text-muted">
                            No active sessions found.
                        </div>
                    </div>
                    <button type="submit" class="btn btn-outline-danger">Sign out selected devices</button>
                </form>

                <hr class="my-4">
                <p class="text-muted small text-center mb-0">
                    <a th:href="@{/account/password}">Change your password</a>
                </p>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white border-top py-3 text-center text-muted small">
    &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> MediKiosk &middot; SIH26047
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
