<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Patient Intake Conversation - MediKiosk')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patient Intake Conversation - MediKiosk</title>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<div th:replace="~{fragments/nav :: authnav}"></div>

<main class="flex-grow-1 py-4">
    <div class="container intake-conversation">

        <div class="card shadow-sm intake-card">
            <div class="card-header intake-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h1 class="h4 fw-bold mb-0 medikiosk-title">MediKiosk</h1>
                    <p class="small text-muted mb-0">Patient Intake Conversation</p>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="small text-muted">Current language</span>
                    <span id="currentLangBadge" class="badge rounded-pill text-bg-primary" data-lang="en">English</span>
                </div>
            </div>

            <div class="card-body">
                <div id="chatWindow" class="chat-window" role="log" aria-live="polite" aria-atomic="false"
                     aria-label="Intake conversation">
                    <div id="chatMessages" class="chat-messages">
                        <div class="chat-message assistant">
                            <div class="chat-bubble">
                                <span id="assistantGreeting" class="chat-text">Hello! I can help you describe what has been troubling you.
                                    Please tell me about your problem in your own words.</span>
                            </div>
                        </div>
                        <div class="chat-message patient">
                            <div class="chat-bubble">
                                <span class="chat-text">I have had a mild headache and a bit of fever for the last two days.</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-footer bg-white">
                <div class="row g-2 align-items-center mb-3">
                    <div class="col-12 col-md-5 col-lg-4">
                        <label for="languageSelect" class="form-label small text-muted mb-1">Language</label>
                        <select id="languageSelect" class="form-select form-select-sm" aria-label="Choose conversation language">
                            <option value="en" selected>English</option>
                            <option value="hi">Hindi</option>
                            <option value="te">Telugu</option>
                            <option value="ta">Tamil</option>
                            <option value="kn">Kannada</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-3 text-md-end">
                        <button id="speakQuestion" type="button" class="btn btn-sm btn-outline-secondary w-100"
                                aria-pressed="false" data-ui-only="true">
                            Speak question
                        </button>
                    </div>
                    <div class="col-12 col-md-4 text-md-end">
                        <span class="small text-muted ui-hint" id="uiHint" aria-hidden="true">&nbsp;</span>
                    </div>
                </div>

                <div class="input-group">
                    <button id="micButton" type="button" class="btn btn-outline-primary" aria-pressed="false"
                            data-ui-only="true" aria-label="Microphone (voice input coming soon)"
                            title="Voice input coming soon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                             viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M3.5 6.5a.5.5 0 0 0-1 0v1a5.5 5.5 0 0 0 4.5 5.43V15H4.5a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1H9v-2.07a5.5 5.5 0 0 0 4.5-5.43v-1a.5.5 0 0 0-1 0v1a4.5 4.5 0 0 1-9 0z"/>
                            <path d="M8 0a3 3 0 0 0-3 3v4a3 3 0 0 0 6 0V3a3 3 0 0 0-3-3m1 7a1 1 0 0 1-2 0V3a1 1 0 0 1 2 0z"/>
                        </svg>
                    </button>
                    <input id="messageInput" type="text" class="form-control" autocomplete="off"
                           placeholder="Type your message..." aria-label="Your message">
                    <button id="sendButton" type="button" class="btn btn-primary">
                        Send
                    </button>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mt-3">
            <a th:href="@{/patient/home}" class="btn btn-outline-secondary btn-sm">Back to Home</a>
        </div>
    </div>
</main>

<footer class="bg-white border-top py-3 text-center text-muted small">
    &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> MediKiosk &middot; SIH26047
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/intake.js}"></script>
</body>
</html>
