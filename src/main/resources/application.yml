spring:
  application:
    name: medikiosk
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medikiosk}
    username: ${DB_USERNAME:medikiosk}
    password: ${DB_PASSWORD:medikiosk}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Details (db, disk, etc.) are only shown to authenticated users; anonymous
      # callers see the aggregate status only.
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    in.devmedi.kiosk: INFO

medikiosk:
  security:
    # Account lockout and password-strength policy (all overridable via env:
    # MEDIKIOSK_SECURITY_MAXFAILED... etc.). Dev-friendly defaults; harden in production.
    max-failed-login-attempts: 5
    lockout-duration-minutes: 15
    # Password policy: the only mandatory rule is minimum length (6).
    # No mandatory character-class requirements; deployments may re-enable
    # require-* flags to harden.
    min-password-length: 6
    min-temporary-password-length: 12
    require-uppercase: false
    require-digit: false
    require-special: false
  documents:
    # Local filesystem location where uploaded clinical document binaries are stored.
    upload-dir: ${MEDIKIOSK_UPLOAD_DIR:upload/clinical-documents}
  ocr:
    # Provider selection for the document text-extraction pipeline. Only engines
    # that are genuinely bound and verified in this deployment may be reported
    # as operational. No OCR engine is bundled here, so the honest status of
    # every engine and language is NOT_IMPLEMENTED.
    provider: local-dev
    # Languages evaluated for OCR capability (English, Hindi, Telugu).
    languages:
      - en
      - hi
      - te
    # Default per-provider timeout a real engine would use.
    timeout-ms: 15000
  ai:
    # Failover order: primary first. Keys come only from the environment
    # (GROQ_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY).
    failover-order: groq,gemini,openrouter
    providers:
      groq:
        enabled: true
        model: openai/gpt-oss-120b
        base-url: https://api.groq.com/openai/v1
        timeout-ms: 12000
        max-tokens: 1024
      gemini:
        enabled: true
        model: gemini-3.6-flash
        base-url: https://generativelanguage.googleapis.com/v1beta
        timeout-ms: 12000
        max-tokens: 1024
      openrouter:
        enabled: true
        model: google/gemma-4-31b-it:free
        base-url: https://openrouter.ai/api/v1
        timeout-ms: 12000
        max-tokens: 1024
  asr-provider: unavailable
  tts-provider: unavailable
  bhashini:
    # ASR/TTS provider activation for patient voice input and question reading.
    # A real provider only engages when the switch is set to the provider name
    # ("bhashini") AND its credentials are complete; otherwise the deterministic
    # UNAVAILABLE fallback is used and the patient simply types. The switches
    # come from MEDIKIOSK_ASR_PROVIDER / MEDIKIOSK_TTS_PROVIDER; Bhashini
    # credentials arrive only as environment variables (MEDIKIOSK_BHASHINI_USER_ID,
    # MEDIKIOSK_BHASHINI_API_KEY, MEDIKIOSK_BHASHINI_PIPELINE_ID) and are never
    # stored in this file.
    api-url: ${MEDIKIOSK_BHASHINI_API_URL:https://meity-auth.ulcacontrib.org/ulca/apis/v0/model/getModelsPipeline}
    asr-audio-format: wav
    asr-sampling-rate: 16000
    tts-audio-format: wav
    tts-sampling-rate: 22050
