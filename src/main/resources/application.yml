spring:
  application:
    name: medikiosk
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medikiosk}
    username: ${DB_USERNAME:medikiosk}
    password: ${DB_PASSWORD:medikiosk}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    in.devmedi.kiosk: INFO

medikiosk:
  documents:
    # Local filesystem location where uploaded clinical document binaries are stored.
    upload-dir: ${MEDIKIOSK_UPLOAD_DIR:upload/clinical-documents}
  ocr:
    # No OCR engine is bundled in this deployment. When a real engine is wired
    # up as an OcrProvider bean, point this at it and update the provider.
    provider: local-dev
  ai:
    # Failover order: primary first. Keys come only from the environment
    # (GROQ_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY).
    failover-order: groq,gemini,openrouter
    providers:
      groq:
        enabled: true
        model: openai/gpt-oss-120b
        base-url: https://api.groq.com/openai/v1
        timeout-ms: 12000
        max-tokens: 1024
      gemini:
        enabled: true
        model: gemini-3.6-flash
        base-url: https://generativelanguage.googleapis.com/v1beta
        timeout-ms: 12000
        max-tokens: 1024
      openrouter:
        enabled: true
        model: google/gemma-4-31b-it:free
        base-url: https://openrouter.ai/api/v1
        timeout-ms: 12000
        max-tokens: 1024
