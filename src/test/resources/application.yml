spring:
  datasource:
    url: jdbc:h2:mem:medikiosk;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoint:
    health:
      show-details: always

medikiosk:
  documents:
    upload-dir: ${java.io.tmpdir}/medikiosk-test-documents
